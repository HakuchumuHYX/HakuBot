<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
{{ font_css | safe }}

/* 和帮助图同一套：粉色贴纸墙做页头 */
:root {
    --wall: #ffe4ec;
    --paper: #ffffff;
    --ink: #26202b;
    --sub: #625a6a;
    --muted: #a49cab;
    --line: #f0e8ee;
    --accent: #e0457b;
    --keep: #2f9e6a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: Haku, 'Noto Color Emoji', sans-serif;
    color: var(--ink);
    background: var(--paper);
}

header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    padding: 30px 36px 24px;
    background: var(--wall);
}

h1 { font-size: 34px; font-weight: 900; }

header p { margin-top: 6px; font-size: 16px; color: var(--sub); }

main { padding: 24px 36px 4px; }

footer { padding: 18px 36px 26px; font-size: 13px; color: var(--muted); text-align: center; }

{% block style %}{% endblock %}
</style>
</head>
<body>
{% block content %}{% endblock %}
<footer>{% block footer %}HakuBot{% endblock %}</footer>
</body>
</html>
