<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
{{ font_css | safe }}

:root {
    --primary: #5c7cfa;
    --primary-deep: #3b5bdb;
    --danger: #f0566a;
    --warn: #f59f00;
    --ok: #20b26b;
    --ink: #24324a;
    --sub: #6b7a90;
    --muted: #a3adbd;
    --line: #e6ebf3;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: Haku, 'Noto Color Emoji', sans-serif;
    color: var(--ink);
    background: #f1f4fa;
}

.page { padding: 28px; }

.sheet {
    background: #fff;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 12px 36px rgba(36, 50, 74, 0.08);
}

.header {
    padding: 28px 34px 24px;
    color: #fff;
    background: linear-gradient(120deg, var(--h1, #4dabf7) 0%, var(--h2, #5c7cfa) 100%);
}

.header h1 { font-size: 30px; font-weight: 900; }

.header p { margin-top: 8px; font-size: 17px; opacity: 0.92; }

.body { padding: 26px 34px 30px; }

.footer {
    padding: 0 34px 22px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
}

{% block style %}{% endblock %}
</style>
</head>
<body>
<div class="page">
    <div class="sheet">
        {% block content %}{% endblock %}
        <div class="footer">{% block footer %}Generated by HakuBot{% endblock %}</div>
    </div>
</div>
</body>
</html>
