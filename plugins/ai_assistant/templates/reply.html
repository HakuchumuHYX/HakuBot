<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="github-markdown-light.css">
    <link rel="stylesheet" href="pygments-default.css">
    <style>
        html, body, .markdown-body {
            background-color: {{ bg_color }} !important;
        }

        .markdown-body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            margin: 0 auto;
            padding: 45px;
        }

        @media (max-width: 767px) {
            .markdown-body {
                padding: 15px;
            }
        }
    </style>
    {% if math %}
    <link rel="stylesheet" href="katex/katex.min.b64_fonts.css">
    <script defer src="katex/katex.min.js"></script>
    <script defer src="katex/mhchem.min.js"></script>
    <script defer src="katex/mathtex-script-type.min.js"></script>
    {% endif %}
</head>
<body>
    <article class="markdown-body">
        {{ md | safe }}
    </article>
</body>
</html>
