<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}HLTV{% endblock %}</title>
    <style>
        {{ font_css | safe }}

        /* 比分、队名、数据列用窄体，中文回落到 Haku（MiSans） */
        @font-face { font-family: "Barlow Condensed"; src: url("fonts/BarlowCondensed-Medium.ttf"); font-weight: 500; }
        @font-face { font-family: "Barlow Condensed"; src: url("fonts/BarlowCondensed-SemiBold.ttf"); font-weight: 600; }
        @font-face { font-family: "Barlow Condensed"; src: url("fonts/BarlowCondensed-Bold.ttf"); font-weight: 700; }

        :root {
            --bg: #20262F;
            --panel: #2A313C;
            --line: #3A4350;
            --text: #E9ECF1;
            --muted: #8C96A5;
            --ct: #6E9BD6;
            --t: #E3A94B;
            --up: #4FBF7A;
            --down: #E0625A;
            --live: #E5484D;
            --gold: #E8C468;
            --bronze: #C58B5A;
            --num: "Barlow Condensed", Haku, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 截图期间若排版跳变导致页面变矮，露出的区域也是底色 */
        html {
            background: var(--bg);
        }

        body {
            font-family: Haku, sans-serif;
            font-size: 16px;
            line-height: 1.4;
            background: var(--bg);
            color: var(--text);
            padding: 26px 24px 18px;
        }

        .num {
            font-family: var(--num);
            font-variant-numeric: tabular-nums;
        }

        .page-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            padding-bottom: 14px;
            margin-bottom: 18px;
            border-bottom: 1px solid var(--line);
        }

        .page-title {
            font-size: 26px;
            font-weight: 700;
        }

        .page-note {
            font-size: 15px;
            color: var(--muted);
        }

        .group {
            margin-bottom: 22px;
        }

        .group-title {
            display: flex;
            align-items: baseline;
            gap: 10px;
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .group-title .num {
            font-size: 18px;
            font-weight: 600;
            color: var(--muted);
        }

        /* 图片位固定尺寸：图片缺失或加载失败时版式不变 */
        .logo-slot {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .logo-slot img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .flag {
            display: inline-block;
            width: 21px;
            height: 14px;
            object-fit: cover;
            border-radius: 2px;
            vertical-align: -1px;
            flex-shrink: 0;
        }

        .empty {
            padding: 40px 0;
            text-align: center;
            color: var(--muted);
        }

        .tip {
            margin-top: 6px;
            font-size: 15px;
            color: var(--muted);
        }

        .tip code {
            font-family: Haku, sans-serif;
            color: var(--text);
        }

        .footer {
            margin-top: 22px;
            padding-top: 12px;
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 16px;
            font-size: 13px;
            color: var(--muted);
        }

        .footer .watermark {
            white-space: pre-wrap;
            line-height: 1.4;
        }

        .footer .source {
            text-align: right;
            line-height: 1.4;
        }

        {% block extra_styles %}{% endblock %}
    </style>
</head>
<body>
    {% block content %}{% endblock %}

    <div class="footer">
        <div class="watermark">{{ watermark_text }}</div>
        <div class="source">
            <div>数据来源 HLTV.org</div>
            <div>生成于 <span class="num">{{ timestamp }}</span></div>
        </div>
    </div>
</body>
</html>
