<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
{{ font_css | safe }}

:root {
    --ink: #1f3346;
    --sub: #5f7488;
    --muted: #9aabbb;
    --accent: #3182ce;
    --up: #e5484d;
    --line: #e3edf6;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: Haku, sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, #e4f3ff 0%, #f4f8ff 50%, #eef0ff 100%);
    padding: 26px;
}

.card {
    background: #fff;
    border-radius: 26px;
    overflow: hidden;
    box-shadow: 0 14px 40px rgba(49, 130, 206, 0.12);
}

.hero {
    padding: 26px 30px 22px;
    color: #fff;
    background: linear-gradient(120deg, #3a7bd5 0%, #6a5af9 100%);
}

.event-id {
    display: inline-block;
    padding: 2px 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.2);
    font-size: 14px;
    letter-spacing: 1px;
}

h1 { margin-top: 10px; font-size: 34px; font-weight: 900; line-height: 1.25; }

.meta { margin-top: 12px; display: flex; gap: 26px; font-size: 15px; opacity: 0.92; }

.meta b { display: block; font-size: 12px; font-weight: 400; opacity: 0.75; }

table {
    width: calc(100% - 48px);
    margin: 20px 24px 0;
    border-collapse: separate;
    border-spacing: 0 6px;
    font-size: 19px;
}

th {
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 700;
    color: var(--sub);
    text-align: right;
}

td {
    padding: 11px 16px;
    background: #f5f9fd;
    text-align: right;
    font-variant-numeric: tabular-nums;
}

th:first-child, td:first-child { text-align: left; }

td:first-child { border-radius: 12px 0 0 12px; font-weight: 900; color: var(--accent); }

td:last-child { border-radius: 0 12px 12px 0; }

td.prediction { font-weight: 700; }

td.delta { color: var(--up); font-size: 16px; }

.foot {
    display: flex;
    justify-content: space-between;
    padding: 16px 30px 20px;
    font-size: 14px;
    color: var(--muted);
}
</style>
</head>
<body>
<div class="card">
    <div class="hero">
        <span class="event-id">EVENT {{ event_id }}</span>
        <h1>{{ name }}</h1>
        <div class="meta">
            <div><b>活动时间</b>{{ period }}</div>
            <div><b>数据更新</b>{{ updated_at }}</div>
        </div>
    </div>
    <table>
        <tr><th>档位</th><th>当前线</th><th>预测线</th><th>差值</th></tr>
        {% for row in rows %}
        <tr>
            <td>{{ row.rank }}</td>
            <td>{{ row.score }}</td>
            <td class="prediction">{{ row.prediction }}</td>
            <td class="delta">{{ row.delta }}</td>
        </tr>
        {% else %}
        <tr><td>--</td><td>--</td><td class="prediction">--</td><td class="delta">--</td></tr>
        {% endfor %}
    </table>
    <div class="foot">
        <span>状态：{{ status }}｜来源：Moesekai | pjsk.moe</span>
        <span>Generated by HakuBot</span>
    </div>
</div>
</body>
</html>
