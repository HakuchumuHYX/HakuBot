<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200">
  <title>{{ title }}</title>
  <style>{{ font_css | safe }}</style>
  <link rel="stylesheet" href="./article-styles.css">
</head>
<body>
  <main class="sheet">
    <header class="masthead">
      <div class="brand-mark">JUYA / AI DAILY</div>
      <div class="issue-meta">{{ date }}</div>
    </header>

    {{ header | safe }}

    <section class="page-content">
      {{ content | safe }}
    </section>

    <footer class="footer">
      <div class="footer-page">PAGE {{ page }} / {{ total_pages }}</div>
      <div class="footer-brand">JUYA AI DAILY</div>
    </footer>
  </main>
</body>
</html>
