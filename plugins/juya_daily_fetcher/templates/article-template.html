<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="./article-styles.css">
</head>
<body>
  <main class="sheet">
    <header class="masthead">
      <div class="brand-mark">JUYA / AI DAILY</div>
      <div class="issue-meta">{{DATE}}</div>
    </header>

    {{HEADER}}

    <section class="page-content">
      {{CONTENT}}
    </section>

    <footer class="footer">
      <div class="footer-page">PAGE {{PAGE}} / {{TOTAL_PAGES}}</div>
      <div class="footer-brand">JUYA AI DAILY</div>
    </footer>
  </main>
</body>
</html>
