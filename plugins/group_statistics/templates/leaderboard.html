<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
{{ font_css | safe }}

:root {
    --bg1: #141a2e;
    --bg2: #1f2a44;
    --card: rgba(30, 38, 60, 0.92);
    --line: rgba(255, 255, 255, 0.08);
    --ink: #e8edf7;
    --sub: #9aa6bf;
    --muted: #66728c;
    --accent: #7ce0d0;
    --gold: #f4c95d;
    --silver: #c3cad6;
    --bronze: #e09a6b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: Haku, 'Noto Color Emoji', sans-serif;
    color: var(--ink);
    background:
        radial-gradient(circle at 85% 0%, rgba(124, 224, 208, 0.18) 0, transparent 40%),
        radial-gradient(circle at 0% 100%, rgba(140, 120, 255, 0.16) 0, transparent 45%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
    padding: 26px;
}

.card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 26px;
    padding: 28px 28px 20px;
}

.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; }

h1 { font-size: 32px; font-weight: 900; }

.date { margin-top: 6px; font-size: 16px; color: var(--sub); }

.total { text-align: right; }

.total .label { font-size: 14px; color: var(--sub); letter-spacing: 1px; }

.total .value {
    font-size: 54px;
    font-weight: 900;
    line-height: 1.05;
    color: var(--accent);
}

.rows { margin-top: 22px; }

.row {
    display: grid;
    grid-template-columns: 48px 1fr auto;
    align-items: center;
    gap: 14px;
    padding: 10px 14px;
    border-radius: 14px;
    position: relative;
    overflow: hidden;
}

.row + .row { margin-top: 6px; }

/* 条形背景表示占第一名的比例 */
.row::before {
    content: "";
    position: absolute;
    inset: 0;
    width: var(--ratio);
    border-radius: inherit;
    background: rgba(124, 224, 208, 0.08);
}

.row > * { position: relative; }

.badge {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 900;
    background: rgba(255, 255, 255, 0.07);
    color: var(--sub);
}

.rank-1 .badge { background: var(--gold); color: #3b2c06; }
.rank-2 .badge { background: var(--silver); color: #262c36; }
.rank-3 .badge { background: var(--bronze); color: #3a1f0d; }

.name {
    font-size: 20px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.count { font-size: 20px; font-weight: 700; }

.count small { margin-left: 3px; font-size: 14px; font-weight: 400; color: var(--sub); }

.empty { margin-top: 22px; color: var(--sub); font-size: 18px; }

.extra {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 14px;
    background: rgba(124, 224, 208, 0.08);
    border-left: 4px solid var(--accent);
    font-size: 17px;
    line-height: 1.6;
    white-space: pre-wrap;
}

.foot { margin-top: 14px; text-align: right; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="card">
    <div class="head">
        <div>
            <h1>{{ title }}</h1>
            <div class="date">统计日期：{{ date }}</div>
        </div>
        <div class="total">
            <div class="label">总消息数</div>
            <div class="value">{{ total }}</div>
        </div>
    </div>

    {% if rows %}
    {% set top = rows[0][1] or 1 %}
    <div class="rows">
        {% for name, count in rows %}
        <div class="row rank-{{ loop.index }}" style="--ratio: {{ (count / top * 100)|round(1) }}%">
            <div class="badge">{{ loop.index }}</div>
            <div class="name">{{ name }}</div>
            <div class="count">{{ count }}<small>条</small></div>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <div class="empty">暂无排行数据</div>
    {% endif %}

    {% if extra %}<div class="extra">{{ extra }}</div>{% endif %}

    <div class="foot">Generated by HakuBot · {{ date }}</div>
</div>
</body>
</html>
