<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
{{ font_css | safe }}

/* 零点推送，深色更合适 */
:root {
    --bg: #161b29;
    --card: #1e2436;
    --line: rgba(255, 255, 255, 0.07);
    --ink: #edf1f8;
    --sub: #9aa5bd;
    --muted: #66718a;
    --accent: #7ce0d0;
    --track: rgba(124, 224, 208, 0.12);
    --gold: #f4c95d;
    --silver: #c3cad6;
    --bronze: #e09a6b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: Haku, 'Noto Color Emoji', sans-serif;
    color: var(--ink);
    background: var(--bg);
    padding: 34px 36px 26px;
}

header { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; }

h1 { font-size: 34px; font-weight: 900; }

.date { margin-top: 6px; font-size: 16px; color: var(--sub); }

.total { text-align: right; font-size: 15px; color: var(--sub); }

.total b { display: block; font-size: 60px; font-weight: 900; line-height: 1; color: var(--accent); }

.rows { margin-top: 24px; padding: 6px 22px; border-radius: 20px; background: var(--card); }

.row {
    display: grid;
    grid-template-columns: 34px 48px 1fr 104px;
    align-items: center;
    gap: 14px;
    padding: 12px 0;
}

.row + .row { border-top: 1px solid var(--line); }

.rank { font-size: 22px; font-weight: 900; color: var(--muted); text-align: center; }

.rank-1 .rank { color: var(--gold); }
.rank-2 .rank { color: var(--silver); }
.rank-3 .rank { color: var(--bronze); }

.avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--line); }

.rank-1 .avatar { box-shadow: 0 0 0 3px var(--gold); }
.rank-2 .avatar { box-shadow: 0 0 0 3px var(--silver); }
.rank-3 .avatar { box-shadow: 0 0 0 3px var(--bronze); }

.who { min-width: 0; }

.name { font-size: 19px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 条长 = 占第一名的比例 */
.bar { margin-top: 7px; height: 6px; border-radius: 3px; background: var(--track); }

.bar span { display: block; height: 100%; border-radius: 3px; background: var(--accent); }

.count { font-size: 22px; font-weight: 900; text-align: right; }

.count small { margin-left: 3px; font-size: 14px; font-weight: 400; color: var(--sub); }

.empty { padding: 18px 0; color: var(--sub); font-size: 18px; }

.extra { margin-top: 18px; font-size: 18px; line-height: 1.6; white-space: pre-wrap; }

footer { margin-top: 16px; font-size: 13px; color: var(--muted); text-align: right; }
</style>
</head>
<body>
<header>
    <div>
        <h1>{{ title }}</h1>
        <div class="date">{{ date }}</div>
    </div>
    <div class="total"><b>{{ total }}</b>条消息</div>
</header>

<div class="rows">
    {% if rows %}
    {% set top = rows[0][2] or 1 %}
    {% for user_id, name, count in rows %}
    <div class="row rank-{{ loop.index }}">
        <span class="rank">{{ loop.index }}</span>
        <img class="avatar" src="https://q1.qlogo.cn/g?b=qq&nk={{ user_id }}&s=100" onerror="this.style.visibility='hidden'">
        <div class="who">
            <div class="name">{{ name }}</div>
            <div class="bar"><span style="width: {{ (count / top * 100)|round(1) }}%"></span></div>
        </div>
        <span class="count">{{ count }}<small>条</small></span>
    </div>
    {% endfor %}
    {% else %}
    <div class="empty">今天还没有人说话</div>
    {% endif %}
</div>

{% if extra %}<div class="extra">{{ extra }}</div>{% endif %}

<footer>HakuBot</footer>
</body>
</html>
