<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
{{ font_css | safe }}

:root {
    --bg: #15171c;
    --card: #1e2128;
    --ink: #eceef2;
    --sub: #a3a8b4;
    --muted: #6c7280;
    --line: #2b2f38;
    --accent: #6fd3c8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    position: relative;
    font-family: Haku, 'Noto Color Emoji', sans-serif;
    color: var(--ink);
    background: var(--bg);
    padding: 34px 36px 26px;
}

/* 防转载水印：铺满全图但压得很淡，不影响阅读 */
.watermark-overlay { position: absolute; inset: 0; pointer-events: none; }

h1 { font-size: 34px; font-weight: 900; line-height: 1.25; }

.lead { margin-top: 8px; font-size: 16px; color: var(--sub); }

.lead b { color: var(--accent); font-weight: 700; }

footer {
    margin-top: 22px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--muted);
    white-space: pre-line;
    text-align: center;
}

{% block style %}{% endblock %}
</style>
</head>
<body>
{% block content %}{% endblock %}
{% if watermark %}<footer>{{ watermark }}</footer>{% endif %}
{% if global_watermark %}
<svg class="watermark-overlay" width="100%" height="100%">
    <defs>
        <pattern id="wm" width="520" height="360" patternUnits="userSpaceOnUse">
            <text x="260" y="180" text-anchor="middle" transform="rotate(-24, 260, 180)"
                  fill="rgba(255, 255, 255, 0.05)" font-size="22" font-family="Haku" font-weight="700">{{ global_watermark }}</text>
        </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#wm)" />
</svg>
{% endif %}
</body>
</html>
