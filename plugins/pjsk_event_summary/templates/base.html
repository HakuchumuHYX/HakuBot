<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
{{ font_css | safe }}

:root {
{% if dark %}
    --bg: #1a1c2e;
    --surface: #24273b;
    --ink: #eef0f7;
    --sub: #b6bacd;
    --muted: #80859c;
    --line: #31354b;
    --wm: rgba(255, 255, 255, 0.045);
{% else %}
    --bg: #eef1f6;
    --surface: #ffffff;
    --ink: #1c2033;
    --sub: #4a5068;
    --muted: #868ca3;
    --line: #e1e5ee;
    --wm: rgba(28, 32, 51, 0.04);
{% endif %}
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    position: relative;
    font-family: Haku, 'Noto Color Emoji', sans-serif;
    color: var(--ink);
    background: var(--bg);
    font-variant-numeric: tabular-nums;
}

.watermark-overlay { position: absolute; inset: 0; pointer-events: none; }

footer {
    padding: 0 36px 26px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--muted);
    white-space: pre-line;
    text-align: center;
}

{% block style %}{% endblock %}
</style>
</head>
<body>
{% block content %}{% endblock %}
{% if watermark %}<footer>{{ watermark }}</footer>{% endif %}
{% if global_watermark %}
<svg class="watermark-overlay" width="100%" height="100%">
    <defs>
        <pattern id="wm" width="520" height="360" patternUnits="userSpaceOnUse">
            <text x="260" y="180" text-anchor="middle" transform="rotate(-24, 260, 180)"
                  fill="var(--wm)" font-size="22" font-family="Haku" font-weight="700">{{ global_watermark }}</text>
        </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#wm)" />
</svg>
{% endif %}
</body>
</html>
