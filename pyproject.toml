[project]
name = "HakuBot"
version = "0.1.0"
description = "HakuBot"
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    "nonebot2[fastapi]>=2.4.4",
    "nonebot-adapter-onebot>=2.4.6",
    # NoneBot 插件
    "nonebot-plugin-apscheduler",
    "markdown",
    "pymdown-extensions",
    "python-markdown-math",
    "pygments",
    "nonebot-plugin-alconna",
    "nonebot-plugin-userinfo",
    # 通用依赖
    "httpx",
    "aiohttp",
    "aiofiles",
    "pillow",
    "numpy",
    "opencv-python-headless",
    "beautifulsoup4",
    "pytz",
    "aiosqlite",
    "tenacity",
    "jinja2",
    "playwright",
    "sqlmodel",
    "PicImageSearch",
    "pydantic",
    "pycryptodome",
    "json-repair>=0.58.0",
    "psutil>=7.2.2",
    "openai>=2.32.0",
    "onnxruntime>=1.24.3",
]

[tool.ruff]
# pjskprofile_snowybot 已废弃，只留作纪念，不再检查
extend-exclude = ["plugins/pjskprofile_snowybot"]

[tool.ruff.lint]
# 写死规则集：不写的话用的是 ruff 当前版本的默认集，升级就会变（0.17 默认开了 776 条）
select = ["E4", "E7", "E9", "F"]
# NoneBot 要先 require() 依赖插件才能 import；包末尾 import 命令模块来注册也是有意的
ignore = ["E402"]

[tool.nonebot]
plugin_dirs = ["plugins"]
builtin_plugins = []

[tool.nonebot.adapters]
nonebot-adapter-onebot = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
"@local" = []

[tool.nonebot.plugins]
plugins = []
